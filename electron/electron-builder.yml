appId: com.changhong.valkyrie
productName: Valkyrie

directories:
  output: release

# 渲染层已由 Vite 打包，运行时只需要主进程、预加载脚本和渲染产物
files:
  - package.json
  - dist/renderer/**/*
  - src/main/**/*
  - src/preload/**/*

# 前端 + 数据层打进同一个安装包：精简 JRE 与数据层程序
extraResources:
  - from: ../server/target/valkyrie-server.jar
    to: server/valkyrie-server.jar
  - from: build/runtime
    to: runtime
  # 应用图标：运行时窗口/任务栏图标用（打包 exe 图标见 win.icon）
  - from: assets/icon.png
    to: icon.png

asar: true

win:
  icon: assets/icon.png
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

mac:
  icon: assets/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Valkyrie
